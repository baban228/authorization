version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./app.db
      SECRET_KEY: super-secret-docker-key-change-me-in-prod
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      APP_ENV: production
    volumes:
      - sqlite_data:/code/server
    restart: unless-stopped

volumes:
  sqlite_data: